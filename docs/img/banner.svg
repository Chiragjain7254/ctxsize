<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">ctxsize</title>
  <desc id="d">A suitcase on a luggage scale, and the tagline: See what your AI coding agent reads before you type, what it costs, and what it silently drops.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16202e"/>
      <stop offset="1" stop-color="#1f1b33"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8df0"/>
      <stop offset="1" stop-color="#2a6fc4"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <!-- faint grid, like a ruler -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 80H1280M0 160H1280M0 240H1280"/>
  </g>

  <!-- words -->
  <text x="64" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-2">ctxsize</text>
  <rect x="68" y="152" width="96" height="6" rx="3" fill="#3a8df0"/>
  <text font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#d8dbe6">
    <tspan x="66" y="206">See what your AI coding agent reads before you type,</tspan>
    <tspan x="66" y="244">what it costs, and what it silently drops.</tspan>
  </text>

  <!-- luggage on a scale -->
  <g transform="translate(860 30)">
    <!-- handle -->
    <path d="M118 62V42a14 14 0 0 1 14-14h56a14 14 0 0 1 14 14v20" fill="none" stroke="#c9ced9" stroke-width="10" stroke-linecap="round"/>
    <!-- case -->
    <rect x="56" y="60" width="268" height="150" rx="20" fill="url(#case)"/>
    <rect x="56" y="60" width="268" height="150" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <!-- straps -->
    <rect x="118" y="60" width="18" height="150" fill="#0f3d7a" fill-opacity="0.55"/>
    <rect x="244" y="60" width="18" height="150" fill="#0f3d7a" fill-opacity="0.55"/>
    <!-- latches -->
    <rect x="170" y="86" width="40" height="16" rx="4" fill="#e9edf5"/>
    <!-- file tags tucked into the case -->
    <g font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="15" font-weight="700">
      <g transform="rotate(-4 190 138)">
        <rect x="146" y="120" width="104" height="26" rx="5" fill="#ffffff"/>
        <text x="156" y="138" fill="#1b4f95">AGENTS.md</text>
      </g>
      <g transform="rotate(3 190 176)">
        <rect x="140" y="160" width="116" height="26" rx="5" fill="#ffffff"/>
        <text x="150" y="178" fill="#6a3fb5">CLAUDE.md</text>
      </g>
    </g>
    <!-- wheels -->
    <circle cx="96" cy="216" r="9" fill="#0b1220"/>
    <circle cx="284" cy="216" r="9" fill="#0b1220"/>
    <!-- scale platform -->
    <rect x="20" y="224" width="340" height="40" rx="12" fill="#e9edf5"/>
    <rect x="20" y="252" width="340" height="12" rx="6" fill="#b9c0d0"/>
    <!-- digital readout -->
    <rect x="132" y="232" width="116" height="22" rx="5" fill="#0b1220"/>
    <text x="190" y="249" text-anchor="middle" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#4cc38a">tokens</text>
  </g>
</svg>
