name: CI

on:
  push:
    branches: [main, 'v0.2-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the built CLI
        run: |
          node dist/cli.mjs --version
          node dist/cli.mjs .
          node dist/cli.mjs --json --max-tokens 100000 . > report.json
      - name: Install the packed tarball and run it
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/fresh"
          cd "$RUNNER_TEMP/fresh"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/*ctxsize-*.tgz
          npx ctxsize --version
          npx ctxsize "$GITHUB_WORKSPACE" --max-tokens 100000
