name: Release

# Publishes to npm when a version tag such as v0.2.0 is pushed. Nothing else triggers it.
# Needs a repository secret named NPM_TOKEN (an npm automation token). See docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm sign the provenance statement

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: The tag, package.json and src/version.ts must name the same version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          src="$(node -p "require('fs').readFileSync('src/version.ts','utf8').match(/VERSION = '([^']+)'/)[1]")"
          echo "tag=$tag package.json=$pkg src/version.ts=$src"
          test "$tag" = "$pkg" && test "$tag" = "$src"
      - run: npm run check
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
