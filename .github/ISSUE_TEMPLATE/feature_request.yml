name: Feature request
description: Suggest a flag, report or check for ctxsize
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first, then your idea. A real repo or workflow helps.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like ctxsize to do?
      description: For a flag, the command you would type and the output you would expect.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
